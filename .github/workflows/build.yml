name: Check XiaoZhi S3CAM Config

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download XiaoZhi v2.5.0
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: v2.5.0
          path: xiaozhi
          submodules: recursive

      - name: Check source
        run: |
          echo "===== XiaoZhi Source ====="
          ls -la xiaozhi

      - name: Find bread compact S3CAM board
        run: |
          echo "===== Searching for S3CAM config ====="

          find xiaozhi/main/boards \
            -type f \
            \( -name "config.h" -o -name "board_config.h" \) \
            | grep -Ei "bread|s3cam|camera" || true

      - name: Show S3CAM configuration
        run: |
          CONFIG=$(find xiaozhi/main/boards \
            -type f \
            \( -name "config.h" -o -name "board_config.h" \) \
            | grep "bread-compact-wifi-s3cam" \
            | head -1)

          echo "CONFIG FILE:"
          echo "$CONFIG"

          if [ -z "$CONFIG" ]; then
            echo "ERROR: S3CAM configuration file not found"
            exit 1
          fi

          echo ""
          echo "===== FULL CONFIG ====="
          cat "$CONFIG"

          echo ""
          echo "===== AUDIO DEFINITIONS ====="

          grep -n -Ei \
            "AUDIO|I2S|MIC|SPK|SPEAKER|BCLK|LRCK|LRC|DOUT|DIN|WS|SCK" \
            "$CONFIG" || true

          echo ""
          echo "===== CAMERA DEFINITIONS ====="

          grep -n -Ei \
            "CAM|CAMERA|XCLK|PCLK|VSYNC|HREF|SIOD|SIOC" \
            "$CONFIG" || true

          echo ""
          echo "===== END ====="

          exit 1
