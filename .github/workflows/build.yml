name: Inspect XiaoZhi Build Config

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Download official XiaoZhi v2.5.0
      # ==========================================
      - name: Download XiaoZhi v2.5.0
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: v2.5.0
          path: xiaozhi
          submodules: recursive


      # ==========================================
      # 2. Verify source
      # ==========================================
      - name: Verify source
        run: |
          echo "Checking source..."

          test -f xiaozhi/CMakeLists.txt
          test -d xiaozhi/main/boards/bread-compact-wifi-s3cam

          echo "SOURCE OK"


      # ==========================================
      # 3. Find CONFIG environment usage
      # ==========================================
      - name: Find CONFIG usage
        run: |
          echo ""
          echo "======================================"
          echo "WHERE CONFIG IS USED"
          echo "======================================"
          echo ""

          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            -E 'ENV\{CONFIG\}|\$ENV\{CONFIG\}|CONFIG=' \
            xiaozhi || true


      # ==========================================
      # 4. Show S3CAM board files
      # ==========================================
      - name: Show S3CAM board files
        run: |
          echo ""
          echo "======================================"
          echo "S3CAM BOARD FILES"
          echo "======================================"
          echo ""

          find \
            xiaozhi/main/boards/bread-compact-wifi-s3cam \
            -maxdepth 3 \
            -type f \
            -print


      # ==========================================
      # 5. Show board JSON / config files
      # ==========================================
      - name: Show board configuration
        run: |
          echo ""
          echo "======================================"
          echo "S3CAM CONFIG CONTENT"
          echo "======================================"
          echo ""

          for f in \
            xiaozhi/main/boards/bread-compact-wifi-s3cam/*.json \
            xiaozhi/main/boards/bread-compact-wifi-s3cam/*.conf \
            xiaozhi/main/boards/bread-compact-wifi-s3cam/*.config \
            xiaozhi/main/boards/bread-compact-wifi-s3cam/*.h
          do
            if [ -f "$f" ]; then
              echo ""
              echo "--------------------------------------"
              echo "FILE: $f"
              echo "--------------------------------------"
              cat "$f"
            fi
          done


      # ==========================================
      # 6. Inspect build scripts
      # ==========================================
      - name: Inspect build scripts
        run: |
          echo ""
          echo "======================================"
          echo "BUILD SCRIPTS"
          echo "======================================"
          echo ""

          find xiaozhi \
            -maxdepth 3 \
            -type f \
            \( \
              -name "build.py" \
              -o -name "release.py" \
              -o -name "*.sh" \
            \) \
            -print


      # ==========================================
      # 7. Search for S3CAM references
      # ==========================================
      - name: Find S3CAM references
        run: |
          echo ""
          echo "======================================"
          echo "BREAD COMPACT WIFI S3CAM REFERENCES"
          echo "======================================"
          echo ""

          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            "bread-compact-wifi-s3cam" \
            xiaozhi || true


      # ==========================================
      # 8. Search board selection logic
      # ==========================================
      - name: Find board selection logic
        run: |
          echo ""
          echo "======================================"
          echo "BOARD SELECTION LOGIC"
          echo "======================================"
          echo ""

          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            -E \
            'BOARD_TYPE|BOARD_NAME|BOARD_CONFIG|CONFIG_BOARD|BOARD=' \
            xiaozhi/scripts \
            xiaozhi/main \
            xiaozhi/CMakeLists.txt \
            2>/dev/null | head -n 300 || true


      # ==========================================
      # 9. Finish
      # ==========================================
      - name: Inspection complete
        run: |
          echo ""
          echo "======================================"
          echo "INSPECTION COMPLETE"
          echo "======================================"
          echo ""
          echo "No firmware was flashed."
          echo "No build was attempted."
