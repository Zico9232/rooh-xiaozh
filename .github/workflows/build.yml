name: Build XiaoZhi ESP32-S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip XiaoZhi source
        run: |
          mkdir -p xiaozhi
          unzip -q xiaozhi-v2.5.0-s3cam-N16R8-audio-nodisplay.zip -d xiaozhi
          echo "=== Extracted files ==="
          ls -la xiaozhi

      - name: Find project directory
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/xiaozhi" -type f -name "CMakeLists.txt" -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: XiaoZhi project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: ${{ env.PROJECT_DIR }}

      - name: Create merged binary
        run: |
          cd "$PROJECT_DIR"

          python "$IDF_PATH/components/esptool_py/esptool/esptool.py" \
            --chip esp32s3 merge_bin \
            -o merged-binary.bin \
            @build/flash_args

          ls -lh merged-binary.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-s3cam-firmware
          path: ${{ env.PROJECT_DIR }}/merged-binary.bin
          if-no-files-found: error
