name: Build ROOH XiaoZhi ESP32-S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Download official XiaoZhi v2.5.0
      # ==========================================
      - name: Download XiaoZhi v2.5.0
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: v2.5.0
          path: xiaozhi
          submodules: recursive


      # ==========================================
      # 2. Verify source
      # ==========================================
      - name: Verify XiaoZhi source
        run: |
          test -f xiaozhi/CMakeLists.txt
          test -f xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h

          echo "XiaoZhi source OK"


      # ==========================================
      # 3. Configure audio pins
      # ==========================================
      - name: Configure ROOH audio pins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path(
              "xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h"
          )

          text = config.read_text()

          pins = {
              "AUDIO_I2S_MIC_GPIO_WS":   41,
              "AUDIO_I2S_MIC_GPIO_SCK":  42,
              "AUDIO_I2S_MIC_GPIO_DIN":  2,

              "AUDIO_I2S_SPK_GPIO_DOUT": 21,
              "AUDIO_I2S_SPK_GPIO_BCLK": 1,
              "AUDIO_I2S_SPK_GPIO_LRCK": 47,
          }

          for name, pin in pins.items():

              pattern = (
                  rf"(?m)^(\s*#define\s+"
                  rf"{re.escape(name)}"
                  rf"\s+)GPIO_NUM_\d+\s*$"
              )

              replacement = rf"\g<1>GPIO_NUM_{pin}"

              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1
              )

              if count != 1:
                  raise RuntimeError(
                      f"Could not configure {name}"
                  )

          config.write_text(text)

          print("================================")
          print("ROOH AUDIO CONFIGURED")
          print("================================")
          PY


      # ==========================================
      # 4. Verify audio configuration
      # ==========================================
      - name: Verify ROOH audio pins
        run: |
          echo "================================"
          echo "ROOH AUDIO PINS"
          echo "================================"

          grep -n \
            -E "AUDIO_I2S_MIC_GPIO|AUDIO_I2S_SPK_GPIO" \
            xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h

          echo ""
          echo "Expected:"
          echo "MIC WS   = GPIO41"
          echo "MIC SCK  = GPIO42"
          echo "MIC DIN  = GPIO2"
          echo ""
          echo "SPK DOUT = GPIO21"
          echo "SPK BCLK = GPIO1"
          echo "SPK LRCK = GPIO47"


      # ==========================================
      # 5. Verify camera pins
      # ==========================================
      - name: Verify camera pins
        run: |
          echo "================================"
          echo "CAMERA PINS"
          echo "================================"

          grep -n \
            "CAMERA_PIN" \
            xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h


      # ==========================================
      # 6. Build directly inside ESP-IDF container
      # ==========================================
      - name: Build XiaoZhi firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: xiaozhi


      # ==========================================
      # 7. Show generated BIN files
      # ==========================================
      - name: Show firmware files
        run: |
          echo "================================"
          echo "BUILD OUTPUT"
          echo "================================"

          find xiaozhi/build \
            -maxdepth 3 \
            -type f \
            \( -name "*.bin" -o -name "flash_args" \) \
            -print


      # ==========================================
      # 8. Upload complete build
      # ==========================================
      - name: Upload XiaoZhi build
        uses: actions/upload-artifact@v4
        with:
          name: ROOH-XiaoZhi-ESP32S3-Build
          path: |
            xiaozhi/build/*.bin
            xiaozhi/build/flash_args
            xiaozhi/build/flash_args.in
          if-no-files-found: error
