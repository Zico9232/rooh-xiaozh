name: Build ROOH XiaoZhi ESP32-S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Download official XiaoZhi v2.5.0
      # ==================================================
      - name: Download XiaoZhi v2.5.0
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: v2.5.0
          path: xiaozhi
          submodules: recursive


      # ==================================================
      # 2. Verify source files
      # ==================================================
      - name: Verify XiaoZhi source
        run: |
          echo "Checking XiaoZhi source..."

          test -f xiaozhi/CMakeLists.txt
          test -f xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h

          echo "XiaoZhi source OK"


      # ==================================================
      # 3. Configure our tested audio GPIO pins
      # ==================================================
      - name: Configure ROOH audio pins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path(
              "xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h"
          )

          text = config.read_text()

          pins = {
              "AUDIO_I2S_MIC_GPIO_WS": 41,
              "AUDIO_I2S_MIC_GPIO_SCK": 42,
              "AUDIO_I2S_MIC_GPIO_DIN": 2,

              "AUDIO_I2S_SPK_GPIO_DOUT": 21,
              "AUDIO_I2S_SPK_GPIO_BCLK": 1,
              "AUDIO_I2S_SPK_GPIO_LRCK": 47,
          }

          for name, pin in pins.items():

              pattern = (
                  rf"(?m)^(\s*#define\s+"
                  rf"{re.escape(name)}"
                  rf"\s+)GPIO_NUM_\d+\s*$"
              )

              replacement = rf"\g<1>GPIO_NUM_{pin}"

              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1
              )

              if count != 1:
                  raise RuntimeError(
                      f"Could not configure {name}"
                  )

          config.write_text(text)

          print("")
          print("====================================")
          print("ROOH AUDIO GPIO CONFIGURATION DONE")
          print("====================================")
          PY


      # ==================================================
      # 4. Verify audio pins
      # ==================================================
      - name: Verify ROOH audio pins
        run: |
          echo ""
          echo "===================================="
          echo "AUDIO CONFIGURATION"
          echo "===================================="

          grep -n \
            -E "AUDIO_I2S_MIC_GPIO|AUDIO_I2S_SPK_GPIO" \
            xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h

          echo ""
          echo "EXPECTED:"
          echo "MIC WS    = GPIO41"
          echo "MIC SCK   = GPIO42"
          echo "MIC DIN   = GPIO2"
          echo ""
          echo "SPK DOUT  = GPIO21"
          echo "SPK BCLK  = GPIO1"
          echo "SPK LRCK  = GPIO47"


      # ==================================================
      # 5. Verify camera pins
      # ==================================================
      - name: Verify camera configuration
        run: |
          echo ""
          echo "===================================="
          echo "CAMERA CONFIGURATION"
          echo "===================================="

          grep -n \
            "CAMERA_PIN" \
            xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h


      # ==================================================
      # 6. Build inside official ESP-IDF environment
      # ==================================================
      - name: Build XiaoZhi firmware
        id: build
        continue-on-error: true
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: xiaozhi
          command: >
            bash -c 'idf.py build 2>&1 | tee build-error.log;
            exit ${PIPESTATUS[0]}'


      # ==================================================
      # 7. Print exact error if build fails
      # ==================================================
      - name: Show exact build error
        if: steps.build.outcome == 'failure'
        run: |
          echo ""
          echo "=========================================="
          echo "BUILD FAILED - SEARCHING FOR REAL ERROR"
          echo "=========================================="

          if [ -f xiaozhi/build-error.log ]; then

            echo ""
            echo "========== IMPORTANT ERRORS =========="
            echo ""

            grep -n \
              -B 10 \
              -A 25 \
              -Ei \
              "CMake Error|ERROR:|FATAL|Failed|dependency|requires.*IDF|not found|No such file" \
              xiaozhi/build-error.log || true

            echo ""
            echo "========== LAST 200 LINES =========="
            echo ""

            tail -n 200 xiaozhi/build-error.log

          else

            echo "build-error.log was not created."

            echo ""
            echo "Checking ESP-IDF internal logs..."

            find xiaozhi/build/log \
              -type f \
              -name "idf_py_stderr_output_*" \
              -exec sh -c '
                echo ""
                echo "========== $1 =========="
                cat "$1"
              ' _ {} \; || true

            find xiaozhi/build/log \
              -type f \
              -name "idf_py_stdout_output_*" \
              -exec sh -c '
                echo ""
                echo "========== $1 =========="
                tail -n 200 "$1"
              ' _ {} \; || true

          fi

          exit 1


      # ==================================================
      # 8. Show generated firmware files
      # ==================================================
      - name: Show firmware files
        if: steps.build.outcome == 'success'
        run: |
          echo ""
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          find xiaozhi/build \
            -maxdepth 3 \
            -type f \
            \( -name "*.bin" -o -name "flash_args" \) \
            -print


      # ==================================================
      # 9. Upload successful build
      # ==================================================
      - name: Upload XiaoZhi firmware
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ROOH-XiaoZhi-ESP32S3
          path: |
            xiaozhi/build/*.bin
            xiaozhi/build/flash_args
          if-no-files-found: error
