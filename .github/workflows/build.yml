name: Build ROOH XiaoZhi ESP32-S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Download official XiaoZhi v2.5.0
      # ==========================================
      - name: Download XiaoZhi v2.5.0
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: v2.5.0
          path: xiaozhi
          submodules: recursive


      # ==========================================
      # 2. Verify project
      # ==========================================
      - name: Verify XiaoZhi source
        run: |
          echo "Checking XiaoZhi source..."

          test -f xiaozhi/CMakeLists.txt
          test -f xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h

          echo "XiaoZhi source OK"


      # ==========================================
      # 3. Configure our audio pins
      # ==========================================
      - name: Configure ROOH audio pins
        run: |
          python3 - <<'PY'

          from pathlib import Path
          import re

          config = Path(
              "xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h"
          )

          text = config.read_text()


          pins = {
              "AUDIO_I2S_MIC_GPIO_WS":   41,
              "AUDIO_I2S_MIC_GPIO_SCK":  42,
              "AUDIO_I2S_MIC_GPIO_DIN":  2,

              "AUDIO_I2S_SPK_GPIO_DOUT": 21,
              "AUDIO_I2S_SPK_GPIO_BCLK": 1,
              "AUDIO_I2S_SPK_GPIO_LRCK": 47,
          }


          for name, pin in pins.items():

              pattern = (
                  rf"(?m)^(\s*#define\s+"
                  rf"{re.escape(name)}"
                  rf"\s+)GPIO_NUM_\d+\s*$"
              )

              replacement = (
                  rf"\g<1>GPIO_NUM_{pin}"
              )

              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1
              )

              if count != 1:
                  raise RuntimeError(
                      f"Could not configure {name}"
                  )


          config.write_text(text)

          print("")
          print("==============================")
          print("ROOH AUDIO CONFIGURED")
          print("==============================")

          PY


      # ==========================================
      # 4. Verify pins
      # ==========================================
      - name: Verify ROOH audio configuration
        run: |
          echo ""
          echo "========================================"
          echo "MICROPHONE"
          echo "Expected:"
          echo "WS   = GPIO41"
          echo "SCK  = GPIO42"
          echo "DIN  = GPIO2"
          echo ""
          echo "SPEAKER"
          echo "Expected:"
          echo "DOUT = GPIO21"
          echo "BCLK = GPIO1"
          echo "LRCK = GPIO47"
          echo "========================================"
          echo ""

          grep -n \
            -E "AUDIO_I2S_MIC_GPIO|AUDIO_I2S_SPK_GPIO" \
            xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h


      # ==========================================
      # 5. Show camera configuration
      # ==========================================
      - name: Verify camera pins
        run: |
          echo ""
          echo "========================================"
          echo "CAMERA CONFIGURATION"
          echo "========================================"

          grep -n \
            "CAMERA_PIN" \
            xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h


      # ==========================================
      # 6. Configure ESP32-S3 target
      # ==========================================
      - name: Configure ESP32-S3
        working-directory: xiaozhi
        run: |
          idf.py set-target esp32s3


      # ==========================================
      # 7. Try selecting S3CAM board
      # ==========================================
      - name: Configure XiaoZhi S3CAM board
        working-directory: xiaozhi
        run: |
          echo "Looking for board configuration tools..."

          if [ -f scripts/release.py ]; then
            python3 scripts/release.py bread-compact-wifi-s3cam || true
          fi

          echo ""
          echo "Board preparation finished"


      # ==========================================
      # 8. Build firmware
      # ==========================================
      - name: Build XiaoZhi firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: xiaozhi


      # ==========================================
      # 9. Inspect build output
      # ==========================================
      - name: Show firmware files
        run: |
          echo ""
          echo "========================================"
          echo "BUILD FILES"
          echo "========================================"

          find xiaozhi/build \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*.bin" \
              -o \
              -name "flash_args" \
            \) \
            -print


      # ==========================================
      # 10. Create merged-binary.bin
      # ==========================================
      - name: Create merged binary
        working-directory: xiaozhi
        run: |
          echo ""
          echo "========================================"
          echo "CREATING MERGED FIRMWARE"
          echo "========================================"

          if [ ! -f build/flash_args ]; then
            echo "ERROR: build/flash_args not found"
            exit 1
          fi

          python3 -m esptool \
            --chip esp32s3 \
            merge_bin \
            -o merged-binary.bin \
            @build/flash_args

          echo ""
          echo "========================================"
          echo "MERGED BINARY CREATED"
          echo "========================================"

          ls -lh merged-binary.bin


      # ==========================================
      # 11. Upload merged firmware
      # ==========================================
      - name: Upload ROOH merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: ROOH-XiaoZhi-ESP32S3-N16R8
          path: xiaozhi/merged-binary.bin
          if-no-files-found: error


      # ==========================================
      # 12. Upload complete build as backup
      # ==========================================
      - name: Upload complete build
        uses: actions/upload-artifact@v4
        with:
          name: ROOH-XiaoZhi-Full-Build
          path: |
            xiaozhi/build/*.bin
            xiaozhi/build/flash_args
          if-no-files-found: warn
