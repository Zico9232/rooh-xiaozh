name: Build ROOH XiaoZhi ESP32-S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download XiaoZhi v2.5.0
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: v2.5.0
          path: xiaozhi
          submodules: recursive

      - name: Verify board
        run: |
          echo "=== BOARD ==="
          cat xiaozhi/main/boards/bread-compact-wifi-s3cam/config.json

          echo ""
          echo "=== BOARD CMAKE ==="
          grep -n -B5 -A10 \
            'set(BOARD_DIR "bread-compact-wifi-s3cam")' \
            xiaozhi/main/CMakeLists.txt

      - name: Configure ROOH audio pins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h"
          )

          if not p.exists():
              raise SystemExit("ERROR: config.h not found")

          s = p.read_text()

          pins = {
              "AUDIO_I2S_MIC_GPIO_WS": 41,
              "AUDIO_I2S_MIC_GPIO_SCK": 42,
              "AUDIO_I2S_MIC_GPIO_DIN": 2,

              "AUDIO_I2S_SPK_GPIO_DOUT": 21,
              "AUDIO_I2S_SPK_GPIO_BCLK": 1,
              "AUDIO_I2S_SPK_GPIO_LRCK": 47,
          }

          for name, pin in pins.items():

              pattern = rf'(#define\s+{name}\s+)GPIO_NUM_\d+'

              s, count = re.subn(
                  pattern,
                  rf'\g<1>GPIO_NUM_{pin}',
                  s,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: pin definition not found: {name}"
                  )

          p.write_text(s)

          print("ROOH AUDIO PINS OK")
          PY

      - name: Show final audio pins
        run: |
          grep -nE \
          'AUDIO_I2S_(MIC|SPK)_GPIO' \
          xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h

      - name: Build XiaoZhi
        id: build
        continue-on-error: true
        run: |
          mkdir -p logs

          docker run --rm \
            -v "$PWD/xiaozhi:/project" \
            -v "$PWD/logs:/logs" \
            -w /project \
            espressif/idf:v5.4 \
            bash -lc '
              set -o pipefail

              . /opt/esp/idf/export.sh

              echo "=============================="
              echo "ESP-IDF"
              echo "=============================="

              idf.py --version

              echo ""
              echo "=============================="
              echo "BUILDING"
              echo "BOARD: bread-compact-wifi-s3cam"
              echo "=============================="

              python3 scripts/build.py \
                bread-compact-wifi-s3cam \
                2>&1 | tee /logs/build.log
            '

      - name: Show build log
        if: always()
        run: |
          echo "================================"
          echo "BUILD LOG"
          echo "================================"

          if [ -f logs/build.log ]; then
              tail -n 250 logs/build.log
          else
              echo "No build.log found"
          fi

      - name: Find firmware
        if: steps.build.outcome == 'success'
        run: |
          echo "================================"
          echo "FIRMWARE"
          echo "================================"

          find xiaozhi \
            -type f \
            \( \
              -name "merged-binary.bin" \
              -o -name "*.bin" \
              -o -name "*.zip" \
            \) \
            -print

      - name: Upload firmware
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ROOH-XiaoZhi-ESP32S3
          path: |
            xiaozhi/build/**/*.bin
            xiaozhi/build/*.bin
            xiaozhi/releases/**
            logs/build.log
          if-no-files-found: warn

      - name: Stop if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "XiaoZhi build failed."
          exit 1
