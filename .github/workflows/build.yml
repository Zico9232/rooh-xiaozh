name: Build ROOH XiaoZhi ESP32-S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download XiaoZhi v2.5.0
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: v2.5.0
          path: xiaozhi
          submodules: recursive

      - name: Verify source
        run: |
          test -f xiaozhi/CMakeLists.txt
          test -f xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h
          echo "SOURCE OK"

      - name: Configure audio GPIO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h"
          )

          s = p.read_text()

          pins = {
              "AUDIO_I2S_MIC_GPIO_WS": 41,
              "AUDIO_I2S_MIC_GPIO_SCK": 42,
              "AUDIO_I2S_MIC_GPIO_DIN": 2,
              "AUDIO_I2S_SPK_GPIO_DOUT": 21,
              "AUDIO_I2S_SPK_GPIO_BCLK": 1,
              "AUDIO_I2S_SPK_GPIO_LRCK": 47,
          }

          for name, pin in pins.items():
              pattern = (
                  rf"(?m)^(\s*#define\s+"
                  rf"{re.escape(name)}\s+)"
                  rf"GPIO_NUM_\d+"
              )

              s, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + f"GPIO_NUM_{pin}",
                  s,
                  count=1
              )

              if count != 1:
                  raise RuntimeError(
                      f"Missing GPIO definition: {name}"
                  )

          p.write_text(s)

          print("AUDIO GPIO CONFIGURED")
          PY

      - name: Verify GPIO
        run: |
          grep -n -E \
            "AUDIO_I2S_MIC_GPIO|AUDIO_I2S_SPK_GPIO" \
            xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h

      - name: Build inside ESP-IDF
        id: build
        continue-on-error: true
        run: |
          mkdir -p logs

          docker run --rm \
            -v "$PWD/xiaozhi:/project" \
            -v "$PWD/logs:/logs" \
            -w /project \
            espressif/idf:v5.4 \
            bash -lc '
              set -o pipefail
              . /opt/esp/idf/export.sh

              echo "ESP-IDF VERSION:"
              idf.py --version

              echo "STARTING BUILD"

              idf.py -DIDF_TARGET=esp32s3 build \
                2>&1 | tee /logs/build.log
            '

      - name: Show exact errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "========== BUILD ERRORS =========="

          if [ -f logs/build.log ]; then
            grep -n -B 10 -A 20 -Ei \
              "CMake Error|ERROR:|FATAL|FAILED|not found|requires" \
              logs/build.log || true

            echo "========== LAST 150 LINES =========="
            tail -n 150 logs/build.log
          else
            echo "Build log was not created."
          fi

          exit 1

      - name: Verify build configuration
        if: steps.build.outcome == 'success'
        run: |
          echo "========== BOARD CONFIG =========="

          grep -E \
            "^CONFIG_BOARD_TYPE_|^CONFIG_IDF_TARGET|^CONFIG_SPIRAM|^CONFIG_ESPTOOLPY_FLASHSIZE" \
            xiaozhi/sdkconfig || true

          echo "========== FIRMWARE FILES =========="

          find xiaozhi/build \
            -maxdepth 2 \
            -name "*.bin" \
            -print

      - name: Upload build files
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ROOH-XiaoZhi-Build
          path: |
            xiaozhi/build/*.bin
            xiaozhi/build/flash_args
            xiaozhi/sdkconfig
            logs/build.log
          if-no-files-found: error

      - name: Upload error log
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ROOH-Build-Errors
          path: logs/build.log
          if-no-files-found: warn
