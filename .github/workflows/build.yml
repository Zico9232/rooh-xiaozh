name: Build ROOH XiaoZhi ESP32-S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download XiaoZhi v2.5.0
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: v2.5.0
          path: xiaozhi
          submodules: recursive

      - name: Verify source
        run: |
          test -f xiaozhi/CMakeLists.txt
          test -f xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h
          echo "XiaoZhi source OK"

      - name: Configure audio pins
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h")
          s = p.read_text()

          pins = {
              "AUDIO_I2S_MIC_GPIO_WS": 41,
              "AUDIO_I2S_MIC_GPIO_SCK": 42,
              "AUDIO_I2S_MIC_GPIO_DIN": 2,
              "AUDIO_I2S_SPK_GPIO_DOUT": 21,
              "AUDIO_I2S_SPK_GPIO_BCLK": 1,
              "AUDIO_I2S_SPK_GPIO_LRCK": 47,
          }

          import re

          for name, pin in pins.items():
              pattern = rf"(?m)^#define {name} GPIO_NUM_\d+"
              replacement = f"#define {name} GPIO_NUM_{pin}"
              s, count = re.subn(pattern, replacement, s, count=1)
              if count != 1:
                  raise RuntimeError(f"Missing pin definition: {name}")

          p.write_text(s)
          print("Audio pins configured")
          PY

      - name: Verify configuration
        run: |
          grep 'AUDIO_I2S_' xiaozhi/main/boards/bread-compact-wifi-s3cam/config.h

      - name: Build XiaoZhi
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: xiaozhi

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: ROOH-XiaoZhi-Build
          path: |
            xiaozhi/build/*.bin
            xiaozhi/build/flash_args
          if-no-files-found: error
