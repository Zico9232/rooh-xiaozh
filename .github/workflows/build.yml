name: Find CONFIG Error Source

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Download XiaoZhi v2.5.0
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: v2.5.0
          path: xiaozhi
          submodules: recursive

      - name: Find CONFIG references
        run: |
          echo "========================================"
          echo "SEARCHING PROJECT FOR CONFIG"
          echo "========================================"

          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            -E 'CONFIG.*environment|environment.*CONFIG|getenv.*CONFIG|ENV\{CONFIG\}|\$ENV\{CONFIG\}' \
            xiaozhi || true

      - name: Check manifests
        run: |
          echo "========================================"
          echo "SEARCHING COMPONENT MANIFESTS"
          echo "========================================"

          find xiaozhi \
            \( -name "idf_component.yml" -o -name "idf_component.yaml" \) \
            -print0 |
          while IFS= read -r -d '' f; do
            echo ""
            echo "===== $f ====="
            grep -n -Ei \
              'CONFIG|rules|if:|matches|dependencies' \
              "$f" || true
          done

      - name: Reproduce dependency error
        run: |
          mkdir -p logs

          docker run --rm \
            -v "$PWD/xiaozhi:/project" \
            -v "$PWD/logs:/logs" \
            -w /project \
            espressif/idf:v5.4 \
            bash -lc '
              set -o pipefail
              . /opt/esp/idf/export.sh

              python3 scripts/build.py bread-compact-wifi-s3cam \
                2>&1 | tee /logs/build.log || true
            '

      - name: Extract CONFIG error context
        run: |
          echo ""
          echo "========================================"
          echo "CONFIG ERROR CONTEXT"
          echo "========================================"

          grep -n -B30 -A20 \
            'Environment variable "CONFIG"' \
            logs/build.log || true

          echo ""
          echo "========================================"
          echo "DEPENDENCY / MANIFEST ERRORS"
          echo "========================================"

          grep -n -B10 -A15 -Ei \
            'manifest|dependency|CONFIG|CMake Error|ERROR:' \
            logs/build.log | tail -n 300 || true

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-CONFIG-Diagnostic
          path: logs/build.log
          if-no-files-found: error
